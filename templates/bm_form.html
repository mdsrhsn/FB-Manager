{% extends 'base.html' %}
{% block page_title %}{% if bm %}Edit{% else %}Add{% endif %} Business Manager{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px;">
    <form method="POST">
        <div class="form-group">
            <label>BM Name *</label>
            <input type="text" name="bm_name" class="form-control" required value="{{ bm.bm_name if bm else '' }}">
        </div>
        
        <div class="form-group">
            <label>BM ID Number</label>
            <input type="text" name="bm_id" class="form-control" value="{{ bm.bm_id if bm else '' }}" 
                   placeholder="e.g. 123456789012345">
        </div>
        
        <div class="form-group">
            <label>Linked FB Account *</label>
            <select name="fb_account_id" class="form-control" required>
                <option value="">-- Select FB Account --</option>
                {% for acc in fb_accounts %}
                <option value="{{ acc.id }}" {% if bm and bm.fb_account_id == acc.id %}selected{% endif %}>
                    {{ acc.account_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                {% for s in ['active', 'restricted', 'banned', 'disabled'] %}
                <option value="{{ s }}" {% if bm and bm.status == s %}selected{% endif %}>{{ s.title() }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="flex">
            <button type="submit" class="btn btn-primary">{% if bm %}Update{% else %}Save{% endif %}</button>
            <a href="{{ url_for('business_managers') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
