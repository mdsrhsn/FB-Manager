{% extends 'base.html' %}
{% block page_title %}{% if account %}Edit{% else %}Add{% endif %} FB Account{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px;">
    <form method="POST">
        <div class="form-group">
            <label>Account Name *</label>
            <input type="text" name="account_name" class="form-control" required value="{{ account.account_name if account else '' }}">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="{{ account.email if account else '' }}">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ account.phone if account else '' }}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Purchase Date</label>
                <input type="date" name="purchase_date" class="form-control" value="{{ account.purchase_date.strftime('%Y-%m-%d') if account and account.purchase_date else '' }}">
            </div>
            <div class="form-group">
                <label>Purchase Cost (PKR)</label>
                <input type="number" step="0.01" name="purchase_cost" class="form-control" value="{{ account.purchase_cost if account else 0 }}">
            </div>
        </div>
        
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                {% for s in ['active', 'restricted', 'banned', 'disabled'] %}
                <option value="{{ s }}" {% if account and account.status == s %}selected{% endif %}>{{ s.title() }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" class="form-control" rows="3">{{ account.notes if account else '' }}</textarea>
        </div>
        
        <div class="flex">
            <button type="submit" class="btn btn-primary">{% if account %}Update{% else %}Save{% endif %}</button>
            <a href="{{ url_for('fb_accounts') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
