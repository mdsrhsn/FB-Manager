{% extends 'base.html' %}
{% block page_title %}Add Payment Entry{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>Team Member *</label>
            <select name="user_id" class="form-control" required>
                <option value="">-- Select --</option>
                {% for m in members %}
                <option value="{{ m.id }}">{{ m.full_name }} ({{ m.role }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Month *</label>
            <input type="month" name="month" class="form-control" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>FB Earnings ($) *</label>
                <input type="number" step="0.01" name="total_earned_usd" class="form-control" required>
                <small class="text-muted">Is member ne kitna earn kiya</small>
            </div>
            <div class="form-group">
                <label>Agreed Amount (PKR) *</label>
                <input type="number" step="0.01" name="agreed_amount_pkr" class="form-control" required>
                <small class="text-muted">Member ko kitna dena hai</small>
            </div>
        </div>
        
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        
        <div class="flex">
            <button type="submit" class="btn btn-primary">Save Entry</button>
            <a href="{{ url_for('payments') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
